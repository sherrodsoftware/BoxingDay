name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The project relies on Xcode 26 build settings (default main-actor
    # isolation), so test with the same Xcode used for development.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run tests
        run: >-
          xcodebuild -project "Boxing Day.xcodeproj" -scheme "Boxing Day"
          -configuration Debug CODE_SIGNING_ALLOWED=NO test
